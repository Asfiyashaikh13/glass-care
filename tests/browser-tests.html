<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Glass Care Calculation Tests</title></head>
<body>
<pre id="results">RUNNING</pre>
<script src="../calculations.js"></script>
<script>
  const results = [];
  function test(name, run) {
    try {
      run();
      results.push({ name, passed: true });
    } catch (error) {
      results.push({ name, passed: false, error: error.message });
    }
  }
  function equal(actual, expected, message = "") {
    if (actual !== expected) throw new Error(message || `Expected ${expected}, got ${actual}`);
  }
  function close(actual, expected, message = "") {
    if (Math.abs(actual - expected) > 1e-12) throw new Error(message || `Expected ${expected}, got ${actual}`);
  }
  const base = { category: "Test glass", unit: "Pcs", quantity: 1, rate: 0, discountPercent: 0, gstRate: 0 };

  test("₹12,557.03 rounds down to ₹12,557", () => equal(GlassCareCalculations.calculateTotals([{ ...base, rate: 12557.03 }], "Tamil Nadu").payable, 12557));
  test("₹12,557.50 rounds up to ₹12,558", () => equal(GlassCareCalculations.calculateTotals([{ ...base, rate: 12557.5 }], "Tamil Nadu").payable, 12558));
  test("304.8 mm × 304.8 mm converts to one square foot", () => {
    const line = GlassCareCalculations.calculateLine({ ...base, unit: "Sqft", height: 304.8, width: 304.8, rate: 100 });
    close(line.measure, 1);
    close(line.amount, 100);
  });
  test("Cubic feet requires depth and converts all dimensions", () => {
    const missing = GlassCareCalculations.calculateLine({ ...base, unit: "Cubic Ft", height: 304.8, width: 304.8 });
    if (!missing.errors.some(error => error.includes("thickness/depth"))) throw new Error("Missing depth was not rejected");
    close(GlassCareCalculations.calculateLine({ ...base, unit: "Cubic Ft", height: 304.8, width: 304.8, thickness: 304.8 }).measure, 1);
  });
  test("discount precedes Karnataka CGST/SGST", () => {
    const totals = GlassCareCalculations.calculateTotals([{ ...base, rate: 1000, discountPercent: 10, gstRate: 18 }], "Karnataka");
    equal(totals.subtotal, 900); equal(totals.cgst, 81); equal(totals.sgst, 81); equal(totals.igst, 0);
  });
  test("interstate GST uses IGST only", () => {
    const totals = GlassCareCalculations.calculateTotals([{ ...base, rate: 1000, gstRate: 18 }], "Tamil Nadu");
    equal(totals.igst, 180); equal(totals.cgst, 0); equal(totals.sgst, 0);
  });
  test("different GST rates remain separate in the tax breakdown", () => {
    const totals = GlassCareCalculations.calculateTotals([
      { ...base, rate: 1000, gstRate: 5 },
      { ...base, rate: 1000, gstRate: 18 }
    ], "Karnataka");
    equal(totals.taxBreakdown.length, 2);
    equal(totals.taxBreakdown[0].rate, 5);
    equal(totals.taxBreakdown[1].rate, 18);
  });
  test("manual taxable amount updates discount and tax", () => {
    const line = GlassCareCalculations.calculateLine({ ...base, rate: 1000, gstRate: 18, taxableAmountOverride: 800 });
    equal(line.discountAmount, 200); equal(line.discountPercent, 20); equal(line.taxAmount, 144);
  });
  test("manual tax amount updates the implied GST rate", () => {
    const line = GlassCareCalculations.calculateLine({ ...base, rate: 1000, discountPercent: 10, gstRate: 18, taxAmountOverride: 80 });
    equal(line.taxableAmount, 900); close(line.gstRate, 80 / 900 * 100); equal(line.taxAmount, 80);
  });

  const passed = results.filter(result => result.passed).length;
  document.getElementById("results").textContent = JSON.stringify({ passed, failed: results.length - passed, results }, null, 2);
</script>
</body>
</html>
